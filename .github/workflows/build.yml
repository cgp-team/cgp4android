name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release:
        description: "Build release APK instead of debug (requires secrets)"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK (manual install)
        run: |
          ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Write local.properties (from secrets; optional)
        # debug 不需要；release 需要 buspost.baseUrl（HTTPS）+ 签名。缺省留空。
        run: |
          {
            echo "buspost.baseUrl=${{ secrets.BUSPOST_BASE_URL }}"
            echo "amap.key=${{ secrets.AMAP_KEY }}"
            echo "amap.webKey=${{ secrets.AMAP_WEB_KEY }}"
          } > local.properties

      - name: Build debug APK
        if: ${{ inputs.release != true }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build release APK
        if: ${{ inputs.release == true }}
        env:
          BUSPOST_SIGNING_PROPS: ${{ secrets.BUSPOST_SIGNING_PROPS }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
