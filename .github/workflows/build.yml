name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release:
        description: "Build release APK instead of debug (requires secrets)"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK packages
        # 若高德依赖从 aliyun 镜像在 GitHub runner 上拉取缓慢，可在仓库 Settings 配置自托管 AAR 镜像。
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Write local.properties (from secrets; optional)
        # debug 不需要；release 需要 buspost.baseUrl（HTTPS）+ 签名。缺省留空。
        run: |
          {
            echo "buspost.baseUrl=${{ secrets.BUSPOST_BASE_URL }}"
            echo "amap.key=${{ secrets.AMAP_KEY }}"
            echo "amap.webKey=${{ secrets.AMAP_WEB_KEY }}"
          } > local.properties

      - name: Build debug APK
        if: ${{ inputs.release != true }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build release APK
        if: ${{ inputs.release == true }}
        env:
          BUSPOST_SIGNING_PROPS: ${{ secrets.BUSPOST_SIGNING_PROPS }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
